name = "kalima-entitlement"
main = "worker.js"
compatibility_date = "2026-09-01"

# After `wrangler kv namespace create KV` copy the returned id here.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
ALLOW_ORIGIN = "https://kalima.tools"

# Secrets (never commit these):
#   npx wrangler secret put PADDLE_SECRET
#   PADDLE_SECRET = <Paddle → Developer → Notifications → signing secret>
